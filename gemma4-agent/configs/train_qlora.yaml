# P5.6 DoRA SFT — agent-dev-spec §5–§6 (G14 rank≤64).
# CLI: python scripts/train_qlora.py --config configs/train_qlora.yaml \
#        --data data_train/sft.jsonl --out agent/adapters/<name>
# GPU train is gated on keeper growth + CLOUD_APPROVAL; use --dry-run for CPU checks.

# Ship / harvest base (G6). QAT W4A16 checkpoint dir resolved via model_path / $MODEL_PATH.
base_model: gemma-4-31b-it-qat-w4a16-ct
# Empty → $MODEL_PATH, else /models/gemma-4-31B-it-qat-w4a16-ct
model_path: ""

# peft_type: dora (preferred) | lora; rank ∈ {32,64}; α=2r
peft_type: dora
rank: 64
lora_alpha: 128
lora_dropout: 0.05

# Targets: attn + MLP (Gemma projected modules)
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

learning_rate: 2.0e-4
lr_scheduler_type: cosine
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
logging_steps: 10
save_steps: 50
seed: 42

# Seq len train ≤28000 (under 32768). Sized for Gemma-4 chat-template tokenized
# SFT max≈22421 (tool_call expansion) with headroom; dry-run must report 0 truncated.
max_seq_length: 24576

# Assistant-only CE: system/user/tool_response → label -100; supervise tool_call + model free-text only.
assistant_only_loss: true
gradient_checkpointing: true
# HF Trainer: non-reentrant checkpointing (required with use_cache=False + DoRA).
gradient_checkpointing_use_reentrant: false
bf16: true
# Prefer SDPA; set flash_attention_2 only when flash-attn is installed on the train host.
attn_implementation: sdpa

# QLoRA load of W4A16/QAT base for GPU train (ignored by --dry-run).
load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# VRAM note (31B QAT/4bit + DoRA r=64, seq≈22–24k, batch=1, grad-ckpt, bf16):
# - A40 48GB: marginal / likely OOM at 24k without further packing or seq-cut; prefer ≤16k or A100.
# - A100 80GB: required for comfortable max_seq_length=24576 DoRA SFT.

# Plan A: adapters saved under --out; merge later via scripts/merge_adapters.py (TIES).
# Plan B: serve unmerged adapter with vLLM LoRA (max_lora_rank≥rank).
adapter_serve_note: >
  Plan A (preferred): after P5.7 4-bit serve-check, merge DoRA→base with
  scripts/merge_adapters.py (configs/merge_ties.yaml) into agent/adapters/master_swe_adapter.
  Plan B: keep adapter folder and load via vLLM LoRA alongside gemma-4-31b-it-qat-w4a16-ct.
